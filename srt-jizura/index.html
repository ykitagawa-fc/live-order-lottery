<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SRT→JIZURA変換</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#f3f4f7; --panel:#ffffff; --fg:#1d2230; --muted:#667085; --line:#d9dce4;
  --accent:#3b5bdb; --gap:#fff1d6; --gapfg:#8a5a00; --ok:#1f7a4d;
  --sans:"Zen Kaku Gothic New",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#12151d; --panel:#1a1e29; --fg:#e6e8ef; --muted:#9aa3b5; --line:#2c3242;
  --accent:#8ea2ff; --gap:#3a2e14; --gapfg:#f2c46b; --ok:#5fd09a; color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 48px;display:grid;gap:20px}
h1{font-size:1.5rem;margin:0}
.lead{color:var(--muted);margin:4px 0 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;min-width:0}
.label{font-size:.75rem;letter-spacing:.08em;color:var(--muted);font-weight:700}
textarea{width:100%;box-sizing:border-box;min-height:300px;font-family:var(--mono);font-size:13px;line-height:1.55;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:12px;text-align:center;color:var(--muted);font-size:.9rem}
.drop.on{border-color:var(--accent);color:var(--accent)}
.settings{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.settings label{display:flex;gap:6px;align-items:center;font-size:.9rem}
input[type=number]{width:64px;font-family:var(--mono);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-family:var(--sans)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font-family:var(--sans);font-weight:700;border:1px solid var(--accent);background:var(--accent);color:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer}
button.sub{background:transparent;color:var(--accent)}
.stats{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.msg{font-size:.85rem;color:var(--ok);min-height:1.2em}
.list{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:8px;font-family:var(--mono);font-size:13px}
.li{display:grid;grid-template-columns:76px 1fr;gap:10px;padding:5px 10px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{color:var(--muted);font-variant-numeric:tabular-nums}
.li.gap{background:var(--gap);color:var(--gapfg)}
.li.gap .t{color:var(--gapfg)}
.li .x{font-family:var(--sans);min-width:0;overflow-wrap:anywhere}
.note{font-size:.85rem;color:var(--muted)}
code{font-family:var(--mono);font-size:.9em}
</style></head><body>
<div class="wrap">
  <header>
    <h1>SRT → JIZURA 変換</h1>
    <p class="lead">SRTを、JIZURAの歌詞欄に貼れる時刻付きLRCに変換します。行と行の間の空きは間奏として書き出します。処理はこのブラウザ内だけで行われます。</p>
  </header>
  <div class="panel">
    <div class="label">設定</div>
    <div class="settings">
      <label for="minGap">間奏にする空き <input id="minGap" type="number" min="0" step="0.5" value="2"> 秒以上</label>
      <label for="gapMode">間奏の書き方
        <select id="gapMode">
          <option value="interlude">[間奏 秒数] 記法</option>
          <option value="blank">時刻だけの空行</option>
          <option value="none">書き出さない(LRCのみ)</option>
        </select>
      </label>
      <label for="intro"><input id="intro" type="checkbox" checked> 冒頭の空きも間奏にする</label>
      <label for="tail">最後の行のあと <input id="tail" type="number" min="0" step="0.5" value="0"> 秒の余韻</label>
    </div>
  </div>
  <div class="grid">
    <section class="panel">
      <div class="label">入力 SRT</div>
      <div class="drop" id="drop">SRTファイルをここにドロップ、または
        <label for="file" style="color:var(--accent);cursor:pointer;text-decoration:underline">ファイルを選ぶ</label>
        <input id="file" type="file" accept=".srt,.txt" hidden>
      </div>
      <textarea id="src" spellcheck="false" aria-label="SRT入力"></textarea>
      <div class="row">
        <button class="sub" id="sample" type="button">サンプルに戻す</button>
        <button class="sub" id="clear" type="button">消す</button>
      </div>
    </section>
    <section class="panel">
      <div class="label">出力 JIZURA用テキスト</div>
      <div class="stats" id="stats"></div>
      <textarea id="out" spellcheck="false" readonly aria-label="変換結果"></textarea>
      <div class="row">
        <button id="copy" type="button">コピー</button>
        <span class="msg" id="msg" role="status"></span>
      </div>
    </section>
  </div>
  <section class="panel">
    <div class="label">タイムライン確認(黄色が間奏)</div>
    <div class="list" id="list"></div>
    <p class="note">JIZURAで時刻付きの <code>[間奏 秒数]</code> が効かない場合は、「間奏の書き方」を「時刻だけの空行」に切り替えて試してください。</p>
  </section>
</div>
<script>
const SAMPLE = `1
00:00:12,340 --> 00:00:15,820
夜明けの街を歩いてく

2
00:00:16,100 --> 00:00:19,500
君の声がまだ残ってる

3
00:00:28,000 --> 00:00:31,200
[Chorus]

4
00:00:28,000 --> 00:00:31,200
光の中で

5
00:00:31,400 --> 00:00:35,900
もう一度 名前を呼んで
`;
const $ = id => document.getElementById(id);
const src=$('src'), out=$('out');
function toSec(t){const m=t.trim().match(/(\d+):(\d+):(\d+)[,.](\d+)/);if(!m)return null;
  return (+m[1])*3600+(+m[2])*60+(+m[3])+(+('0.'+m[4]));}
function lrcTime(s){s=Math.max(0,s);let cs=Math.round(s*100);const m=Math.floor(cs/6000);cs-=m*6000;
  const sec=Math.floor(cs/100),c=cs%100;return `[${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}.${String(c).padStart(2,'0')}]`;}
function fmtGap(g){const r=Math.round(g*10)/10;return Number.isInteger(r)?String(r):r.toFixed(1);}
function parseSRT(text){
  const blocks=text.replace(/\r/g,'').split(/\n\s*\n/);const items=[];
  for(const b of blocks){const lines=b.split('\n').map(l=>l.trim()).filter(Boolean);
    const ti=lines.findIndex(l=>l.includes('-->'));if(ti<0)continue;
    const [a,z]=lines[ti].split('-->');const st=toSec(a),en=toSec(z);if(st==null||en==null)continue;
    let txt=lines.slice(ti+1).filter(l=>!/^\[[^\]]*\]$/.test(l)).join(' ').trim();
    if(!txt)continue;items.push({st,en,txt});}
  items.sort((x,y)=>x.st-y.st);return items;}
function convert(){
  const items=parseSRT(src.value);
  const minGap=Math.max(0,parseFloat($('minGap').value)||0);
  const mode=$('gapMode').value, intro=$('intro').checked, tail=Math.max(0,parseFloat($('tail').value)||0);
  const outL=[], view=[]; let gaps=0;
  const addGap=(at,len)=>{if(mode==='none')return;gaps++;
    if(mode==='interlude'){outL.push(`${lrcTime(at)}[間奏 ${fmtGap(len)}]`);}
    else outL.push(lrcTime(at));
    view.push({t:at,x:`間奏 ${fmtGap(len)}秒`,gap:true});};
  if(intro&&items.length&&items[0].st>=minGap&&items[0].st>0)addGap(0,items[0].st);
  items.forEach((it,i)=>{
    outL.push(lrcTime(it.st)+it.txt);view.push({t:it.st,x:it.txt});
    const next=items[i+1];
    if(next){const g=next.st-it.en;if(g>=minGap&&g>0)addGap(it.en,g);}
    else if(tail>0){addGap(it.en,tail);}
  });
  out.value=outL.join('\n');
  $('stats').textContent=items.length?`歌詞 ${items.length}行・間奏 ${gaps}か所`:'SRTの時刻行が見つかりません';
  $('list').innerHTML=view.map(v=>`<div class="li${v.gap?' gap':''}"><span class="t">${lrcTime(v.t).slice(1,-1)}</span><span class="x"></span></div>`).join('');
  [...$('list').querySelectorAll('.x')].forEach((el,i)=>el.textContent=view[i].x);
}
function load(text){src.value=text;convert();}
src.addEventListener('input',convert);
['minGap','gapMode','intro','tail'].forEach(id=>$(id).addEventListener('input',convert));
$('sample').onclick=()=>load(SAMPLE);
$('clear').onclick=()=>load('');
$('file').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(load);};
const drop=$('drop');
['dragover','dragenter'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('on');}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,()=>drop.classList.remove('on')));
document.addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)f.text().then(load);});
$('copy').onclick=()=>{const done=()=>{$('msg').textContent='コピーしました';setTimeout(()=>$('msg').textContent='',2000);};
  try{navigator.clipboard.writeText(out.value).then(done,()=>{out.select();$('msg').textContent='選択しました。Ctrl+Cでコピーしてください';});}
  catch(e){out.select();$('msg').textContent='選択しました。Ctrl+Cでコピーしてください';}};
load(SAMPLE);
</script>
</body></html>
