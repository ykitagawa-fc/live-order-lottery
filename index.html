<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6ead3">
<title>LIVE ORDER LOTTERY｜オンラインライブ出演順抽選</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="wrap">
  <header class="head">
    <p class="eyebrow">LIVE ORDER LOTTERY</p>
    <h1>オンラインライブ出演順抽選</h1>
    <p class="lead" id="lead">ガラガラを回して、あなたの抽選番号を決めよう！</p>
  </header>

  <section class="machine-area" aria-hidden="true">
    <svg class="machine" viewBox="0 0 320 300" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#c98d4f"/>
          <stop offset="1" stop-color="#8a5526"/>
        </linearGradient>
        <linearGradient id="woodDark" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#7a4a20"/>
          <stop offset="1" stop-color="#5a3414"/>
        </linearGradient>
      </defs>
      <!-- 台座 -->
      <rect x="40" y="252" width="240" height="22" rx="6" fill="url(#woodDark)"/>
      <polygon points="95,252 120,150 130,150 112,252" fill="url(#woodDark)"/>
      <polygon points="225,252 200,150 190,150 208,252" fill="url(#woodDark)"/>
      <!-- 受け皿 -->
      <path d="M210 252 q30 -4 56 -22 l8 6 q-26 22 -60 26z" fill="#6b3d17"/>
      <!-- 回転ドラム -->
      <g id="drum" class="drum">
        <polygon points="118,48 202,48 252,98 252,182 202,232 118,232 68,182 68,98"
                 fill="url(#wood)" stroke="#5a3414" stroke-width="5" stroke-linejoin="round"/>
        <polygon points="130,66 190,66 234,110 234,170 190,214 130,214 86,170 86,110"
                 fill="none" stroke="#e2b57d" stroke-width="2" opacity=".55"/>
        <g stroke="#6b3d17" stroke-width="2" opacity=".5">
          <line x1="68" y1="140" x2="252" y2="140"/><line x1="160" y1="48" x2="160" y2="232"/>
        </g>
        <g id="innerBalls" class="inner-balls">
          <circle cx="130" cy="180" r="9" fill="#e94b3c"/>
          <circle cx="150" cy="190" r="9" fill="#f2c230"/>
          <circle cx="172" cy="186" r="9" fill="#3d8bd9"/>
          <circle cx="192" cy="176" r="9" fill="#48b06a"/>
          <circle cx="160" cy="172" r="9" fill="#fff"/>
        </g>
      </g>
      <!-- 軸 -->
      <circle cx="160" cy="140" r="12" fill="#4a2a10"/>
      <!-- ハンドル -->
      <g id="handle" class="handle">
        <rect x="156" y="136" width="70" height="8" rx="4" fill="#4a2a10"/>
        <rect x="218" y="122" width="12" height="36" rx="6" fill="#c0392b"/>
      </g>
      <circle cx="160" cy="140" r="6" fill="#d9a35f"/>
      <!-- 飛び出す玉 -->
      <circle id="ball" class="ball" cx="214" cy="232" r="13" fill="#e94b3c"/>
    </svg>
  </section>

  <section class="controls" id="controls">
    <button type="button" class="spin-btn" id="spinBtn">ガラガラを回す！</button>
    <p class="note">抽選はお一人様1回です。抽選番号の小さい順に出演します。出演順は全参加者の受付終了後に確定します。</p>
  </section>

  <section class="result" id="result" hidden aria-live="polite">
    <p class="result-label">あなたの抽選番号は……</p>
    <p class="result-number" id="resultNumber">----</p>
    <button type="button" class="copy-btn" id="copyBtn">番号をコピー</button>
    <p class="copy-status" id="copyStatus" role="status"></p>
    <p class="note">この番号を主催者に申告してください<br>出演順は全参加者の受付終了後に確定します</p>
  </section>

  <p class="error" id="error" role="alert" hidden></p>

  <footer class="foot">
    <label class="sound-toggle">
      <input type="checkbox" id="soundToggle" checked> 効果音
    </label>
  </footer>
</main>
<script src="./script.js"></script>
</body>
</html>
